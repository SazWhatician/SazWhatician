<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Saswat Mohanty - AI Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117;#130029;#0a001a;#0D1117" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#130029">
        <animate attributeName="stop-color" values="#130029;#1a0033;#0D1117;#130029" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117;#0a001a;#130029;#0D1117" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#F472B6;#22D3EE;#7B2CBF;#A855F7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#A855F7;#F472B6;#22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#22D3EE;#A855F7;#7B2CBF;#F472B6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7B2CBF" opacity="0.14"/>
    </pattern>

    <path id="orbitA" d="M 100 200 A 500 110 0 1 0 1100 200 A 500 110 0 1 0 100 200" fill="none"/>
    <path id="orbitB" d="M 220 200 A 380 70 0 1 0 980 200 A 380 70 0 1 0 220 200" fill="none"/>
    <path id="orbitC" d="M 350 200 A 250 40 0 1 0 850 200 A 250 40 0 1 0 350 200" fill="none"/>
  </defs>

  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#dotGrid)"/>

  <!-- Corner brackets -->
  <g stroke="#A855F7" stroke-width="2" fill="none" opacity="0.75">
    <path d="M 24 24 L 24 62 M 24 24 L 62 24"/>
    <path d="M 1176 24 L 1176 62 M 1176 24 L 1138 24"/>
    <path d="M 24 356 L 24 318 M 24 356 L 62 356"/>
    <path d="M 1176 356 L 1176 318 M 1176 356 L 1138 356"/>
  </g>

  <!-- Orbit rings faint -->
  <use href="#orbitA" stroke="#7B2CBF" stroke-width="0.7" opacity="0.28"/>
  <use href="#orbitB" stroke="#22D3EE" stroke-width="0.7" opacity="0.22"/>
  <use href="#orbitC" stroke="#F472B6" stroke-width="0.7" opacity="0.20"/>

  <!-- Orbiting particles -->
  <circle r="4" fill="#22D3EE" filter="url(#softGlow)">
    <animateMotion dur="14s" repeatCount="indefinite">
      <mpath href="#orbitA"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#F472B6" filter="url(#softGlow)">
    <animateMotion dur="14s" repeatCount="indefinite" begin="-7s">
      <mpath href="#orbitA"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#A855F7" filter="url(#softGlow)">
    <animateMotion dur="11s" repeatCount="indefinite">
      <mpath href="#orbitB"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#FCD34D" filter="url(#softGlow)">
    <animateMotion dur="9s" repeatCount="indefinite" begin="-3s">
      <mpath href="#orbitC"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#22D3EE" filter="url(#softGlow)">
    <animateMotion dur="9s" repeatCount="indefinite" begin="-6s">
      <mpath href="#orbitC"/>
    </animateMotion>
  </circle>

  <!-- Top tags -->
  <text x="40" y="55" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#A855F7" letter-spacing="5">// PROFILE.INITIALIZED</text>
  <text x="1160" y="55" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#F472B6" letter-spacing="5">v7.0 // ULTRA_INSTINCT</text>

  <!-- Main Name -->
  <text x="600" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-weight="900" font-size="86" fill="url(#nameGrad)" filter="url(#strongGlow)" letter-spacing="6">SASWAT MOHANTY</text>

  <!-- Subtitle -->
  <text x="600" y="228" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" fill="#22D3EE" letter-spacing="7">AI ENGINEER · MULTI-AGENT ARCHITECT · FULL-STACK SYSTEMS</text>

  <!-- Divider glow -->
  <line x1="360" y1="252" x2="840" y2="252" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <circle cx="600" cy="252" r="3" fill="#A855F7" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Chip tags -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" letter-spacing="3">
    <g transform="translate(392, 282)">
      <rect x="-64" y="-14" width="128" height="24" rx="12" fill="#0D1117" stroke="#A855F7" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#A855F7">[ LANGGRAPH ]</text>
    </g>
    <g transform="translate(540, 282)">
      <rect x="-64" y="-14" width="128" height="24" rx="12" fill="#0D1117" stroke="#F472B6" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#F472B6">[ SSE STREAM ]</text>
    </g>
    <g transform="translate(688, 282)">
      <rect x="-64" y="-14" width="128" height="24" rx="12" fill="#0D1117" stroke="#22D3EE" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#22D3EE">[ NEXT.JS 15 ]</text>
    </g>
    <g transform="translate(836, 282)">
      <rect x="-64" y="-14" width="128" height="24" rx="12" fill="#0D1117" stroke="#FCD34D" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#FCD34D">[ GSAP · 60FPS ]</text>
    </g>
  </g>

  <!-- Bottom row: status + location -->
  <g transform="translate(40, 340)">
    <circle cx="0" cy="0" r="5" fill="#22c55e" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;6.5;5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="4" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#22c55e" letter-spacing="3">SYSTEM ONLINE · CORE ACTIVE · TELEMETRY NOMINAL</text>
  </g>
  <text x="1160" y="344" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#22D3EE" letter-spacing="3">INDIA · IST · UTC+05:30</text>
</svg>
