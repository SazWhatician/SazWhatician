<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Craft Ledger">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#130029"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>

    <linearGradient id="bGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#F5D976"/>
    </linearGradient>
    <linearGradient id="bPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="bCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D174D"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="bViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <filter id="g">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D4AF37" stroke-width="0.25" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="820" height="480" fill="url(#bg)" rx="14"/>
  <rect width="820" height="480" fill="url(#grid)" rx="14"/>
  <rect x="1" y="1" width="818" height="478" fill="none" stroke="#D4AF37" stroke-width="0.6" rx="14" opacity="0.55"/>

  <!-- Header -->
  <text x="30" y="42" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="18" fill="#D4AF37" letter-spacing="2">The Craft Ledger</text>
  <text x="790" y="42" text-anchor="end" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#A855F7" letter-spacing="2">— skills, honestly measured —</text>
  <line x1="30" y1="58" x2="790" y2="58" stroke="#D4AF37" stroke-width="0.4" opacity="0.4"/>

  <!-- Bar 1: AI Engineering (92%) -->
  <text x="30" y="100" font-family="Georgia, 'Cormorant Garamond', serif" font-size="16" fill="#F5D976" font-weight="500">AI Engineering</text>
  <text x="790" y="100" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#D4AF37" font-weight="700" letter-spacing="1">0.92</text>
  <rect x="30" y="110" width="760" height="10" fill="#0a0014" stroke="#D4AF37" stroke-width="0.4" rx="5"/>
  <rect x="30" y="110" width="0" height="10" fill="url(#bGold)" rx="5" filter="url(#g)">
    <animate attributeName="width" from="0" to="699.2" dur="2.2s" fill="freeze" begin="0.2s"/>
  </rect>
  <circle cx="30" cy="115" r="5" fill="#F5D976" filter="url(#g)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="0.2s"/>
    <animate attributeName="cx" from="30" to="729.2" dur="2.2s" fill="freeze" begin="0.2s"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite" begin="2.4s"/>
  </circle>
  <text x="30" y="134" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#9CA3AF">LangGraph · Claude · Gemini · retrieval · evaluation</text>

  <!-- Bar 2: Full-Stack (87%) -->
  <text x="30" y="172" font-family="Georgia, 'Cormorant Garamond', serif" font-size="16" fill="#F5D976" font-weight="500">Full-Stack — Next.js &amp; FastAPI</text>
  <text x="790" y="172" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#22D3EE" font-weight="700" letter-spacing="1">0.87</text>
  <rect x="30" y="182" width="760" height="10" fill="#0a0014" stroke="#D4AF37" stroke-width="0.4" rx="5"/>
  <rect x="30" y="182" width="0" height="10" fill="url(#bCyan)" rx="5" filter="url(#g)">
    <animate attributeName="width" from="0" to="661.2" dur="2.2s" fill="freeze" begin="0.5s"/>
  </rect>
  <circle cx="30" cy="187" r="5" fill="#22D3EE" filter="url(#g)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="0.5s"/>
    <animate attributeName="cx" from="30" to="691.2" dur="2.2s" fill="freeze" begin="0.5s"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite" begin="2.7s"/>
  </circle>
  <text x="30" y="206" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#9CA3AF">TypeScript · React · Node · Prisma · edge runtimes</text>

  <!-- Bar 3: Motion & Interface (83%) -->
  <text x="30" y="244" font-family="Georgia, 'Cormorant Garamond', serif" font-size="16" fill="#F5D976" font-weight="500">Motion &amp; Interface Craft</text>
  <text x="790" y="244" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#F472B6" font-weight="700" letter-spacing="1">0.83</text>
  <rect x="30" y="254" width="760" height="10" fill="#0a0014" stroke="#D4AF37" stroke-width="0.4" rx="5"/>
  <rect x="30" y="254" width="0" height="10" fill="url(#bPink)" rx="5" filter="url(#g)">
    <animate attributeName="width" from="0" to="630.8" dur="2.2s" fill="freeze" begin="0.8s"/>
  </rect>
  <circle cx="30" cy="259" r="5" fill="#F472B6" filter="url(#g)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="0.8s"/>
    <animate attributeName="cx" from="30" to="660.8" dur="2.2s" fill="freeze" begin="0.8s"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite" begin="3s"/>
  </circle>
  <text x="30" y="278" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#9CA3AF">GSAP · Framer Motion · Three.js · Lenis · Barba</text>

  <!-- Bar 4: Distributed Systems (74%) -->
  <text x="30" y="316" font-family="Georgia, 'Cormorant Garamond', serif" font-size="16" fill="#F5D976" font-weight="500">Distributed Systems</text>
  <text x="790" y="316" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#A855F7" font-weight="700" letter-spacing="1">0.74</text>
  <rect x="30" y="326" width="760" height="10" fill="#0a0014" stroke="#D4AF37" stroke-width="0.4" rx="5"/>
  <rect x="30" y="326" width="0" height="10" fill="url(#bPurple)" rx="5" filter="url(#g)">
    <animate attributeName="width" from="0" to="562.4" dur="2.2s" fill="freeze" begin="1.1s"/>
  </rect>
  <circle cx="30" cy="331" r="5" fill="#A855F7" filter="url(#g)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.1s"/>
    <animate attributeName="cx" from="30" to="592.4" dur="2.2s" fill="freeze" begin="1.1s"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite" begin="3.3s"/>
  </circle>
  <text x="30" y="350" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#9CA3AF">Docker · Kafka · Redis · vector stores · CI / CD</text>

  <!-- Bar 5: Algorithms & Design (78%) -->
  <text x="30" y="388" font-family="Georgia, 'Cormorant Garamond', serif" font-size="16" fill="#F5D976" font-weight="500">Algorithms &amp; Systems Design</text>
  <text x="790" y="388" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#7B2CBF" font-weight="700" letter-spacing="1">0.78</text>
  <rect x="30" y="398" width="760" height="10" fill="#0a0014" stroke="#D4AF37" stroke-width="0.4" rx="5"/>
  <rect x="30" y="398" width="0" height="10" fill="url(#bViolet)" rx="5" filter="url(#g)">
    <animate attributeName="width" from="0" to="592.8" dur="2.2s" fill="freeze" begin="1.4s"/>
  </rect>
  <circle cx="30" cy="403" r="5" fill="#7B2CBF" filter="url(#g)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.4s"/>
    <animate attributeName="cx" from="30" to="622.8" dur="2.2s" fill="freeze" begin="1.4s"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite" begin="3.6s"/>
  </circle>
  <text x="30" y="422" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#9CA3AF">finite-state machines · graphs &amp; DP · LeetCode Saswat144</text>

  <!-- Footer -->
  <line x1="30" y1="450" x2="790" y2="450" stroke="#D4AF37" stroke-width="0.3" opacity="0.4"/>
  <text x="30" y="468" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#6B7280">calibrated by hours, not adjectives.</text>
  <text x="790" y="468" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#D4AF37" letter-spacing="2">v7.1 · signed</text>
</svg>
