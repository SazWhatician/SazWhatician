<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Skill Matrix">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#130029"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="bPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="bCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D174D"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="bGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="bViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <filter id="g">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#A855F7" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="800" height="460" fill="url(#bg)" rx="14"/>
  <rect width="800" height="460" fill="url(#grid)" rx="14"/>

  <!-- Frame -->
  <rect x="1" y="1" width="798" height="458" fill="none" stroke="#7B2CBF" stroke-width="1" rx="14" opacity="0.6"/>

  <!-- Header -->
  <text x="30" y="38" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#A855F7" letter-spacing="4">// SKILL_MATRIX.telemetry</text>
  <text x="770" y="38" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#F472B6" letter-spacing="3">↳ real-time proficiency snapshot</text>
  <line x1="30" y1="52" x2="770" y2="52" stroke="#7B2CBF" stroke-width="1" opacity="0.45"/>

  <!-- Bar 1: AI & Agentic (92%) -->
  <text x="30" y="92" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#E9D5FF" font-weight="600">AI &amp; Agentic Engineering</text>
  <text x="770" y="92" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#A855F7" font-weight="700">92%</text>
  <rect x="30" y="102" width="740" height="12" fill="#0a001a" stroke="#7B2CBF" stroke-width="0.5" rx="6"/>
  <rect x="30" y="102" width="0" height="12" fill="url(#bPurple)" rx="6" filter="url(#g)">
    <animate attributeName="width" from="0" to="680.8" dur="2.2s" fill="freeze" begin="0.2s"/>
  </rect>
  <circle cx="30" cy="108" r="6" fill="#A855F7" filter="url(#g)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="0.2s"/>
    <animate attributeName="cx" from="30" to="710.8" dur="2.2s" fill="freeze" begin="0.2s"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.3s" repeatCount="indefinite" begin="2.4s"/>
  </circle>
  <text x="30" y="128" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6B7280" letter-spacing="1">LangGraph · Claude · Gemini · RAG pipelines · Human-in-loop orchestration</text>

  <!-- Bar 2: Full-Stack (87%) -->
  <text x="30" y="162" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#E9D5FF" font-weight="600">Full-Stack Systems · Next.js / FastAPI</text>
  <text x="770" y="162" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#22D3EE" font-weight="700">87%</text>
  <rect x="30" y="172" width="740" height="12" fill="#0a001a" stroke="#7B2CBF" stroke-width="0.5" rx="6"/>
  <rect x="30" y="172" width="0" height="12" fill="url(#bCyan)" rx="6" filter="url(#g)">
    <animate attributeName="width" from="0" to="643.8" dur="2.2s" fill="freeze" begin="0.5s"/>
  </rect>
  <circle cx="30" cy="178" r="6" fill="#22D3EE" filter="url(#g)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="0.5s"/>
    <animate attributeName="cx" from="30" to="673.8" dur="2.2s" fill="freeze" begin="0.5s"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.3s" repeatCount="indefinite" begin="2.7s"/>
  </circle>
  <text x="30" y="198" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6B7280" letter-spacing="1">TypeScript · React 19 · Node.js · Prisma · REST + SSE · Edge functions</text>

  <!-- Bar 3: Motion & UI (83%) -->
  <text x="30" y="232" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#E9D5FF" font-weight="600">Motion Design &amp; High-Framerate UI</text>
  <text x="770" y="232" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#F472B6" font-weight="700">83%</text>
  <rect x="30" y="242" width="740" height="12" fill="#0a001a" stroke="#7B2CBF" stroke-width="0.5" rx="6"/>
  <rect x="30" y="242" width="0" height="12" fill="url(#bPink)" rx="6" filter="url(#g)">
    <animate attributeName="width" from="0" to="614.2" dur="2.2s" fill="freeze" begin="0.8s"/>
  </rect>
  <circle cx="30" cy="248" r="6" fill="#F472B6" filter="url(#g)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="0.8s"/>
    <animate attributeName="cx" from="30" to="644.2" dur="2.2s" fill="freeze" begin="0.8s"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.3s" repeatCount="indefinite" begin="3s"/>
  </circle>
  <text x="30" y="268" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6B7280" letter-spacing="1">GSAP · Framer Motion · Three.js · Lenis · Barba.js · Choreographed transitions</text>

  <!-- Bar 4: Distributed / MLOps (72%) -->
  <text x="30" y="302" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#E9D5FF" font-weight="600">Distributed Systems &amp; MLOps</text>
  <text x="770" y="302" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#FCD34D" font-weight="700">72%</text>
  <rect x="30" y="312" width="740" height="12" fill="#0a001a" stroke="#7B2CBF" stroke-width="0.5" rx="6"/>
  <rect x="30" y="312" width="0" height="12" fill="url(#bGold)" rx="6" filter="url(#g)">
    <animate attributeName="width" from="0" to="532.8" dur="2.2s" fill="freeze" begin="1.1s"/>
  </rect>
  <circle cx="30" cy="318" r="6" fill="#FCD34D" filter="url(#g)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.1s"/>
    <animate attributeName="cx" from="30" to="562.8" dur="2.2s" fill="freeze" begin="1.1s"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.3s" repeatCount="indefinite" begin="3.3s"/>
  </circle>
  <text x="30" y="338" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6B7280" letter-spacing="1">Docker · Kafka · Redis · Vector DBs · Observability · GitHub Actions CI/CD</text>

  <!-- Bar 5: Systems Design / DSA (78%) -->
  <text x="30" y="372" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#E9D5FF" font-weight="600">Systems Design &amp; Competitive DSA</text>
  <text x="770" y="372" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#7B2CBF" font-weight="700">78%</text>
  <rect x="30" y="382" width="740" height="12" fill="#0a001a" stroke="#7B2CBF" stroke-width="0.5" rx="6"/>
  <rect x="30" y="382" width="0" height="12" fill="url(#bViolet)" rx="6" filter="url(#g)">
    <animate attributeName="width" from="0" to="577.2" dur="2.2s" fill="freeze" begin="1.4s"/>
  </rect>
  <circle cx="30" cy="388" r="6" fill="#7B2CBF" filter="url(#g)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.4s"/>
    <animate attributeName="cx" from="30" to="607.2" dur="2.2s" fill="freeze" begin="1.4s"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.3s" repeatCount="indefinite" begin="3.6s"/>
  </circle>
  <text x="30" y="408" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6B7280" letter-spacing="1">Finite-state machines · Concurrency · Graphs &amp; DP · LeetCode Saswat144</text>

  <!-- Footer -->
  <line x1="30" y1="428" x2="770" y2="428" stroke="#7B2CBF" stroke-width="0.5" opacity="0.4"/>
  <text x="30" y="448" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6B7280" letter-spacing="2">$ ./skills --json</text>
  <text x="770" y="448" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#A855F7" letter-spacing="2">stream: OK · 60fps · calibrated</text>
</svg>
