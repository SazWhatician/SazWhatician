<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Telemetry">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="100%" stop-color="#130029"/>
    </linearGradient>

    <linearGradient id="ringA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#F5D976"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="ringC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="ringD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#F5D976"/>
    </linearGradient>

    <filter id="hg">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="hgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4AF37" stroke-width="0.25" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" fill="url(#hbg)" rx="14"/>
  <rect width="1000" height="280" fill="url(#hgrid)" rx="14"/>
  <rect x="1" y="1" width="998" height="278" fill="none" stroke="#D4AF37" stroke-width="0.6" rx="14" opacity="0.55"/>

  <!-- Header -->
  <text x="30" y="42" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="18" fill="#D4AF37" letter-spacing="2">The Ledger</text>
  <g transform="translate(970 38)">
    <circle cx="-116" cy="0" r="4" fill="#22c55e" filter="url(#hg)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="-104" y="4" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="12" fill="#22c55e" letter-spacing="2">signal · steady</text>
  </g>
  <line x1="30" y1="58" x2="970" y2="58" stroke="#D4AF37" stroke-width="0.4" opacity="0.4"/>

  <!-- 4 gauges -->
  <g>
    <!-- Gauge 1: Commits -->
    <g transform="translate(180 160)">
      <circle r="60" fill="none" stroke="#1a0033" stroke-width="8"/>
      <circle r="60" fill="none" stroke="url(#ringA)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" transform="rotate(-90)" filter="url(#hg)">
        <animate attributeName="stroke-dashoffset" from="377" to="38" dur="2s" fill="freeze" begin="0.3s"/>
      </circle>
      <text y="-4" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="26" fill="#F5D976">450+</text>
      <text y="14" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#E9D5FF">commits</text>
      <text y="30" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" fill="#6B7280" letter-spacing="1">shipped · signed</text>
    </g>
    <!-- Gauge 2: Repos -->
    <g transform="translate(400 160)">
      <circle r="60" fill="none" stroke="#1a0033" stroke-width="8"/>
      <circle r="60" fill="none" stroke="url(#ringB)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" transform="rotate(-90)" filter="url(#hg)">
        <animate attributeName="stroke-dashoffset" from="377" to="94" dur="2s" fill="freeze" begin="0.5s"/>
      </circle>
      <text y="-4" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="30" fill="#22D3EE">28</text>
      <text y="14" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#E9D5FF">repositories</text>
      <text y="30" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" fill="#6B7280" letter-spacing="1">public · active</text>
    </g>
    <!-- Gauge 3: Focus -->
    <g transform="translate(620 160)">
      <circle r="60" fill="none" stroke="#1a0033" stroke-width="8"/>
      <circle r="60" fill="none" stroke="url(#ringC)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" transform="rotate(-90)" filter="url(#hg)">
        <animate attributeName="stroke-dashoffset" from="377" to="19" dur="2s" fill="freeze" begin="0.7s"/>
      </circle>
      <text y="-4" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="24" fill="#F472B6">99.9%</text>
      <text y="14" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#E9D5FF">focus</text>
      <text y="30" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" fill="#6B7280" letter-spacing="1">evening sprint</text>
    </g>
    <!-- Gauge 4: FPS -->
    <g transform="translate(840 160)">
      <circle r="60" fill="none" stroke="#1a0033" stroke-width="8"/>
      <circle r="60" fill="none" stroke="url(#ringD)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" transform="rotate(-90)" filter="url(#hg)">
        <animate attributeName="stroke-dashoffset" from="377" to="0" dur="2s" fill="freeze" begin="0.9s"/>
      </circle>
      <text y="-4" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="30" fill="#22c55e">60</text>
      <text y="14" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#E9D5FF">fps</text>
      <text y="30" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" fill="#6B7280" letter-spacing="1">motion locked</text>
    </g>
  </g>

  <!-- Bottom rail -->
  <line x1="30" y1="248" x2="970" y2="248" stroke="#D4AF37" stroke-width="0.3" opacity="0.4"/>
  <text x="30" y="266" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#6B7280">measured slowly, kept honestly.</text>
  <text x="970" y="266" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#D4AF37" letter-spacing="2">rev · v7.1</text>
</svg>
