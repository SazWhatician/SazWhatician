<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Live Telemetry HUD">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#130029"/>
    </linearGradient>

    <linearGradient id="ringA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="ringC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="ringD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="hg">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="hgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A855F7" stroke-width="0.3" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" fill="url(#hbg)" rx="14"/>
  <rect width="1000" height="260" fill="url(#hgrid)" rx="14"/>
  <rect x="1" y="1" width="998" height="258" fill="none" stroke="#7B2CBF" stroke-width="1" rx="14" opacity="0.55"/>

  <!-- Header -->
  <text x="30" y="34" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#A855F7" letter-spacing="4">// TELEMETRY.live_ribbon</text>
  <g transform="translate(970 30)">
    <circle cx="-92" cy="0" r="4" fill="#22c55e" filter="url(#hg)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="-80" y="4" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#22c55e" letter-spacing="2">STREAM.OK</text>
  </g>
  <line x1="30" y1="48" x2="970" y2="48" stroke="#7B2CBF" stroke-width="0.5" opacity="0.4"/>

  <!-- 4 gauges -->
  <g>
    <!-- Gauge 1: Commits -->
    <g transform="translate(180 150)">
      <circle r="60" fill="none" stroke="#1a0033" stroke-width="8"/>
      <circle r="60" fill="none" stroke="url(#ringA)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" transform="rotate(-90)" filter="url(#hg)">
        <animate attributeName="stroke-dashoffset" from="377" to="38" dur="2s" fill="freeze" begin="0.3s"/>
      </circle>
      <text y="-6" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="800" font-size="26" fill="#F472B6">450+</text>
      <text y="14" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#E9D5FF" letter-spacing="2">COMMITS</text>
      <text y="30" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" fill="#6B7280" letter-spacing="1">shipped · signed</text>
    </g>
    <!-- Gauge 2: Repos -->
    <g transform="translate(400 150)">
      <circle r="60" fill="none" stroke="#1a0033" stroke-width="8"/>
      <circle r="60" fill="none" stroke="url(#ringB)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" transform="rotate(-90)" filter="url(#hg)">
        <animate attributeName="stroke-dashoffset" from="377" to="94" dur="2s" fill="freeze" begin="0.5s"/>
      </circle>
      <text y="-6" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="800" font-size="26" fill="#22D3EE">28</text>
      <text y="14" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#E9D5FF" letter-spacing="2">REPOS</text>
      <text y="30" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" fill="#6B7280" letter-spacing="1">public · active</text>
    </g>
    <!-- Gauge 3: Uptime -->
    <g transform="translate(620 150)">
      <circle r="60" fill="none" stroke="#1a0033" stroke-width="8"/>
      <circle r="60" fill="none" stroke="url(#ringC)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" transform="rotate(-90)" filter="url(#hg)">
        <animate attributeName="stroke-dashoffset" from="377" to="19" dur="2s" fill="freeze" begin="0.7s"/>
      </circle>
      <text y="-6" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="800" font-size="22" fill="#FCD34D">99.9%</text>
      <text y="14" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#E9D5FF" letter-spacing="2">FOCUS</text>
      <text y="30" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" fill="#6B7280" letter-spacing="1">evening sprint</text>
    </g>
    <!-- Gauge 4: FPS -->
    <g transform="translate(840 150)">
      <circle r="60" fill="none" stroke="#1a0033" stroke-width="8"/>
      <circle r="60" fill="none" stroke="url(#ringD)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" transform="rotate(-90)" filter="url(#hg)">
        <animate attributeName="stroke-dashoffset" from="377" to="0" dur="2s" fill="freeze" begin="0.9s"/>
      </circle>
      <text y="-6" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="800" font-size="26" fill="#22c55e">60</text>
      <text y="14" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#E9D5FF" letter-spacing="2">FPS</text>
      <text y="30" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" fill="#6B7280" letter-spacing="1">motion locked</text>
    </g>
  </g>

  <!-- Bottom rail -->
  <line x1="30" y1="230" x2="970" y2="230" stroke="#7B2CBF" stroke-width="0.5" opacity="0.4"/>
  <text x="30" y="248" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6B7280" letter-spacing="2">stack: TS · py · nextjs · fastapi   //   focus: multi-agent + SSE   //   region: IST</text>
  <text x="970" y="248" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#A855F7" letter-spacing="2">ttl: fresh · rev: v7.0</text>
</svg>
