<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mission Console">
  <defs>
    <linearGradient id="term" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="100%" stop-color="#050008"/>
    </linearGradient>

    <linearGradient id="titlebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <filter id="crt">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#D4AF37" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Window frame -->
  <rect width="920" height="500" fill="url(#term)" rx="12"/>
  <rect width="920" height="46" fill="url(#titlebar)" rx="12"/>
  <rect y="34" width="920" height="12" fill="url(#titlebar)"/>
  <rect y="46" width="920" height="1" fill="#D4AF37" opacity="0.55"/>

  <!-- Traffic lights -->
  <circle cx="24" cy="23" r="6" fill="#F472B6"/>
  <circle cx="46" cy="23" r="6" fill="#F5D976"/>
  <circle cx="68" cy="23" r="6" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Titlebar text (serif italic) -->
  <text x="460" y="28" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="13" fill="#D4AF37" letter-spacing="2">saswat@studio: ~/missions</text>
  <text x="890" y="28" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6B7280">— × □</text>

  <!-- Scanlines overlay -->
  <rect y="47" width="920" height="453" fill="url(#scanlines)"/>

  <!-- Terminal content -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" filter="url(#crt)">
    <!-- Prompt -->
    <text x="30" y="84">
      <tspan fill="#D4AF37">saswat@studio</tspan><tspan fill="#E9D5FF">:</tspan><tspan fill="#22D3EE">~/missions</tspan><tspan fill="#E9D5FF">$ </tspan><tspan fill="#FFFFFF">./ship --now</tspan>
    </text>

    <!-- Boot lines -->
    <text x="30" y="114" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="0.6s"/>
      <tspan fill="#22c55e">[  ok  ]</tspan><tspan fill="#E9D5FF"> workspace mounted · </tspan><tspan fill="#D4AF37">typescript</tspan><tspan fill="#E9D5FF"> · </tspan><tspan fill="#22D3EE">python</tspan><tspan fill="#E9D5FF"> · </tspan><tspan fill="#F472B6">go</tspan>
    </text>

    <text x="30" y="140" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="1.1s"/>
      <tspan fill="#22c55e">[  ok  ]</tspan><tspan fill="#E9D5FF"> models linked · </tspan><tspan fill="#F472B6">claude</tspan><tspan fill="#E9D5FF"> · </tspan><tspan fill="#22D3EE">gemini</tspan><tspan fill="#E9D5FF"> · </tspan><tspan fill="#D4AF37">openai</tspan>
    </text>

    <text x="30" y="166" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="1.6s"/>
      <tspan fill="#22c55e">[  ok  ]</tspan><tspan fill="#E9D5FF"> vector index warm · </tspan><tspan fill="#A855F7">1,536-dim</tspan><tspan fill="#E9D5FF"> embeddings resident</tspan>
    </text>

    <text x="30" y="192" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="2.1s"/>
      <tspan fill="#F5D976">[ note ]</tspan><tspan fill="#E9D5FF"> pacing at </tspan><tspan fill="#F472B6">120</tspan><tspan fill="#E9D5FF"> req/min per tenant — kind to upstream</tspan>
    </text>

    <text x="30" y="218" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="2.6s"/>
      <tspan fill="#22c55e">[  ok  ]</tspan><tspan fill="#E9D5FF"> interface hydrated · timeline locked at </tspan><tspan fill="#22D3EE">60 fps</tspan>
    </text>

    <!-- Divider -->
    <line x1="30" y1="238" x2="890" y2="238" stroke="#D4AF37" stroke-width="0.4" opacity="0.5"/>

    <!-- Missions section -->
    <text x="30" y="266" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="3.1s"/>
      <tspan font-family="Georgia, serif" font-style="italic" fill="#D4AF37" font-size="14">missions in flight —</tspan>
    </text>

    <text x="30" y="296" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="3.5s"/>
      <tspan fill="#F472B6" font-weight="700">01</tspan><tspan fill="#E9D5FF"> · </tspan><tspan fill="#F5D976">Dr.Debug</tspan><tspan fill="#E9D5FF"> — the debugger that debugs itself </tspan><tspan fill="#22c55e">[ shipping ]</tspan>
    </text>
    <text x="30" y="320" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="3.7s"/>
      <tspan fill="#6B7280" font-style="italic">     traces runtime errors · synthesizes RCA · opens the PR itself</tspan>
    </text>

    <text x="30" y="352" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="4.0s"/>
      <tspan fill="#A855F7" font-weight="700">02</tspan><tspan fill="#E9D5FF"> · </tspan><tspan fill="#F5D976">Polaris</tspan><tspan fill="#E9D5FF"> — grounded research canvas </tspan><tspan fill="#F5D976">[ scaling ]</tspan>
    </text>
    <text x="30" y="376" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="4.2s"/>
      <tspan fill="#6B7280" font-style="italic">     multi-agent answers · citations · a chat that reads like paper</tspan>
    </text>

    <text x="30" y="408" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="4.5s"/>
      <tspan fill="#22D3EE" font-weight="700">03</tspan><tspan fill="#E9D5FF"> · </tspan><tspan fill="#F5D976">Polarassist</tspan><tspan fill="#E9D5FF"> — the copilot that stays quiet until asked </tspan><tspan fill="#22c55e">[ R&amp;D ]</tspan>
    </text>
    <text x="30" y="432" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="4.7s"/>
      <tspan fill="#6B7280" font-style="italic">     context-aware · vector-grounded · fewer suggestions, better ones</tspan>
    </text>

    <!-- Live prompt -->
    <text x="30" y="470" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="5.1s"/>
      <tspan fill="#D4AF37">saswat@studio</tspan><tspan fill="#E9D5FF">:</tspan><tspan fill="#22D3EE">~/missions</tspan><tspan fill="#E9D5FF">$ </tspan>
    </text>

    <!-- Blinking cursor -->
    <rect x="230" y="458" width="8" height="15" fill="#D4AF37" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" fill="freeze" begin="5.1s"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="5.2s"/>
    </rect>
  </g>

  <!-- Footer bar -->
  <line y1="488" x2="920" y2="488" stroke="#D4AF37" stroke-width="0.3" opacity="0.35"/>
  <text x="30" y="498" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="10" fill="#6B7280">tty0 · 24 x 80</text>
  <text x="460" y="498" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="10" fill="#D4AF37" letter-spacing="2">in flight</text>
  <text x="890" y="498" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#22D3EE" letter-spacing="2">tls · 1.3</text>
</svg>
