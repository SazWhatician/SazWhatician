    <!-- Holographic Laser Scanline -->
    <g>
      <rect class="scanline" x="10" y="0" width="460" height="20" fill="url(#scanlineGrad)" opacity="0.75" />
    </g>

    <!-- Bottom Telemetry HUD Bar -->
    <g transform="translate(20, 557)">
      <text x="0" y="7" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#22D3EE">
        ⚡ HOVER / INTERACT
      </text>
      <text x="440" y="7" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#A855F7">
        60 FPS CYBERNETIC AVATAR
      </text>
    </g>
  </g>
</svg>
